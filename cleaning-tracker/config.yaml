name: Cleaning Schedule Tracker
version: "1.37.0"
slug: cleaning-tracker
description: Airbnb cleaning schedule tracker with iCal sync and AI-powered WhatsApp parsing
init: false
arch:
  - amd64
  - aarch64
startup: application
boot: auto
homeassistant_api: true
# Needed by the bridge watchdog to read another add-on's container state and
# start it when it has died. `manager` is the lowest role that permits add-on
# start/stop; `homeassistant_api` alone cannot see the Supervisor at all.
hassio_api: true
hassio_role: manager
ingress: true
ingress_port: 5000
panel_icon: mdi:broom
panel_title: Cleaning Schedule
ports:
  5000/tcp: 5000
ports_description:
  5000/tcp: WhatsApp sidecar inbound endpoint (shared-secret auth)
options:
  ical_url: ""
  anthropic_api_key: ""
  cleaners: []
  gcal_enabled: false
  gcal_calendar_id: ""
  gcal_service_account_json: ""
  whatsapp_shared_secret: ""
  digest_enabled: false
  digest_time: "08:00"
  dead_channel_enabled: true
  dead_channel_days: 14
  bridge_silent_days: 7
  dead_channel_min_msgs: 10
  vps_status_enabled: false
  vps_status_url: ""
  vps_status_label: "VPS"
  vps_push_enabled: false
  vps_push_url: ""
  vps_push_secret: ""
  phone_notify_service: ""
  bridge_watchdog_enabled: true
  bridge_watchdog_slug: ""
  bridge_watchdog_interval_min: 5
  repeat_horizon_days: 21
  review_expiry_days: 7
  digest_include_quotes: false
schema:
  ical_url: url
  anthropic_api_key: password
  cleaners:
    - str
  gcal_enabled: bool
  gcal_calendar_id: str?
  gcal_service_account_json: password?
  whatsapp_shared_secret: password?
  digest_enabled: bool
  digest_time: str?
  dead_channel_enabled: bool
  dead_channel_days: int(1,)
  bridge_silent_days: int(1,)
  dead_channel_min_msgs: int(0,)
  vps_status_enabled: bool
  vps_status_url: str?
  vps_status_label: str?
  vps_push_enabled: bool
  vps_push_url: str?
  vps_push_secret: password?
  phone_notify_service: str?
  bridge_watchdog_enabled: bool
  bridge_watchdog_slug: str?
  bridge_watchdog_interval_min: int(5,)
  repeat_horizon_days: int(1,)
  review_expiry_days: int(1,)
  digest_include_quotes: bool
