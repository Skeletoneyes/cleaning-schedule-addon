name: WhatsApp Bridge
version: "1.2.0"
slug: whatsapp-bridge
description: Baileys WhatsApp linked-device bridge that forwards group messages to the Cleaning Schedule Tracker.
init: false
arch:
  - amd64
  - aarch64
startup: application
boot: auto
host_network: true
homeassistant_api: true
panel_icon: mdi:whatsapp
options:
  group_allowlist: []
  backfill_per_group: 10
  backfill_window_ms: 15000
  shared_secret: ""
  test_alarm: false
schema:
  group_allowlist:
    - str
  backfill_per_group: int
  backfill_window_ms: int
  shared_secret: password?
  test_alarm: bool?
